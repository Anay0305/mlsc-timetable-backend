name: Validate and deploy to EC2

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend and image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q server timetable_parser

      - name: Run backend unit tests
        run: python -m unittest discover -s tests -v

      - name: Build production image
        run: docker build --tag mlsc-timetable-backend:ci .

  deploy:
    name: Deploy main to EC2
    needs: validate
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && vars.EC2_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update and restart the EC2 stack
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "${EC2_USER}@${EC2_HOST}" 'bash -se' <<'REMOTE'
            set -eu
            cd /home/ubuntu/mlsc-timetable-backend
            sudo -n true
            git pull --ff-only origin main
            sudo docker compose up -d --build --remove-orphans

            container_id="$(sudo docker compose ps -q api)"
            test -n "$container_id"
            for attempt in $(seq 1 20); do
              health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [ "$health" = healthy ]; then
                exit 0
              fi
              sleep 3
            done
            echo "API did not become healthy" >&2
            sudo docker compose ps
            sudo docker compose logs --tail=100 api
            exit 1
          REMOTE
